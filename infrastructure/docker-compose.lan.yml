services:
  mongodb:
    image: mongo:7
    container_name: security-room-system-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: security-room-system
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: security-room-system-mosquitto
    restart: unless-stopped
    depends_on:
      mosquitto-passwords:
        condition: service_completed_successfully
    ports:
      - "1883:1883"
      - "9001:9001"
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -u \"$${MQTT_USERNAME}\" -P \"$${MQTT_PASSWORD}\" -t '$$SYS/broker/version' -C 1 > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mosquitto-passwords:
    image: eclipse-mosquitto:2
    container_name: security-room-system-mosquitto-passwords
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    volumes:
      - ./mosquitto/config:/mosquitto/config
    command: >
      sh -c 'test -n "$$MQTT_USERNAME" &&
             test -n "$$MQTT_PASSWORD" &&
             rm -f /mosquitto/config/passwordfile &&
             mosquitto_passwd -b -c /mosquitto/config/passwordfile "$$MQTT_USERNAME" "$$MQTT_PASSWORD" &&
             chown 1883:1883 /mosquitto/config/passwordfile &&
             chmod 0700 /mosquitto/config/passwordfile'
    restart: "no"

  backend:
    build:
      context: ../backend
    container_name: security-room-system-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://mongodb:27017/security-room-system
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_DEVICE_TOKEN: ${MQTT_DEVICE_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-System Administrator}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-mailto:admin@security-room.local}
      WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY}
      WEB_PUSH_PRIVATE_KEY: ${WEB_PUSH_PRIVATE_KEY}
    expose:
      - "4000"

  frontend:
    build:
      context: ../frontend
    container_name: security-room-system-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-80}:80"

volumes:
  mongodb_data:
